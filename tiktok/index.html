<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok OAuth Callback</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      text-align: center;
    }

    code {
      padding: 10px;
      background: #eee;
      display: inline-block;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <h1>TikTok OAuth Redirect</h1>
  <p>If successful, TikTok will redirect back to this page with <strong>?code=...</strong>.</p>
  <h3>Authorization Code:</h3>
  <code id="codeBox">Waiting for TikTok redirect…</code>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    document.getElementById("codeBox").textContent = code || "No code parameter detected.";
  </script>
</body>

</html>
