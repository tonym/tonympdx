<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok OAuth Demo | Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      text-align: center;
    }

    button {
      background: #000;
      color: #fff;
      padding: 14px 26px;
      border: 0;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>TikTok OAuth Demo</h1>
  <p>This demo shows the Login Kit redirect flow required for TikTok App Review.</p>

  <button onclick="window.location.href = authUrl">Login with TikTok</button>

  <script>
    const clientKey = "sbawg6hnqd0jejg55z";
    const redirectUri = encodeURIComponent("https://tonympdx.com/tiktok/");
    const state = "1234";
    const scope = "user.info.basic";

    const authUrl = `
      https://www.tiktok.com/auth/authorize?client_key=${clientKey}
      &response_type=code
      &scope=${scope}
      &redirect_uri=${redirectUri}&state=${state}
    `;
  </script>
</body>

</html>
